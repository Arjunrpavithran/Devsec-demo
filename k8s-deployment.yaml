apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-demo-deployment
  labels:
    app: devsecops-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devsecops-demo
  template:
    metadata:
      labels:
        app: devsecops-demo
    spec:
      containers:
      - name: devsecops-demo
        # Points to your local Artifactory docker registry
        image: localhost:8082/docker-local/devsecops-demo-app:v1.0.0
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: devsecops-demo-service
spec:
  type: NodePort
  selector:
    app: devsecops-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30080